<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LTMG Quotation Tool</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="page-header">
    <div>
      <p class="eyebrow">Internal Sales Tool</p>
      <h1>LTMG Quotation Tool</h1>
      <p class="intro">工程机械和物流搬运设备外贸报价计算器。价格仅供内部计算，请勿录入真实客户隐私信息。</p>
    </div>
  </header>

  <main class="layout">
    <section class="card" aria-labelledby="form-title">
      <div class="section-heading">
        <h2 id="form-title">报价信息 / Quotation Input</h2>
        <button type="button" id="resetSampleButton" class="secondary-button">Load sample FD30</button>
      </div>

      <div id="errorBox" class="error-box" hidden></div>

      <form id="quotationForm" novalidate>
        <div class="grid two-columns">
          <label>
            Product model / 产品型号
            <input id="productModel" name="productModel" type="text" autocomplete="off" required>
          </label>

          <label>
            Product name / 产品名称
            <input id="productName" name="productName" type="text" autocomplete="off" required>
          </label>

          <label>
            Base FOB price / FOB底价，USD
            <input id="baseFobPrice" name="baseFobPrice" type="number" min="0" step="0.01" required>
          </label>

          <label>
            FOB port / FOB港口
            <input id="fobPort" name="fobPort" type="text" autocomplete="off" required>
          </label>

          <label>
            Quantity / 数量
            <input id="quantity" name="quantity" type="number" min="1" step="1" required>
          </label>

          <label>
            Markup type / 利润方式
            <select id="markupType" name="markupType" required>
              <option value="fixed">Fixed amount per unit / 固定每台加价</option>
              <option value="percentage">Percentage / 百分比利润</option>
            </select>
          </label>

          <label>
            Markup value / 利润数值
            <input id="markupValue" name="markupValue" type="number" min="0" step="0.01" required>
          </label>
        </div>

        <label>
          Standard configuration / 标准配置
          <textarea id="standardConfiguration" name="standardConfiguration" rows="4" required></textarea>
        </label>

        <section class="options-panel" aria-labelledby="options-title">
          <div class="section-heading">
            <h3 id="options-title">Options / 选配项</h3>
            <button type="button" id="addOptionButton" class="secondary-button">+ Add option</button>
          </div>
          <div id="optionsList" class="options-list"></div>
        </section>
      </form>
    </section>

    <section class="card output-card" aria-labelledby="summary-title">
      <h2 id="summary-title">价格拆解 / Price Breakdown</h2>
      <dl class="breakdown">
        <div>
          <dt>Base FOB price</dt>
          <dd id="baseFobDisplay">USD 0.00</dd>
        </div>
        <div>
          <dt>Options total</dt>
          <dd id="optionsTotalDisplay">USD 0.00</dd>
        </div>
        <div>
          <dt>Markup</dt>
          <dd id="markupDisplay">USD 0.00</dd>
        </div>
        <div class="highlight-row">
          <dt>Final FOB unit price</dt>
          <dd id="finalUnitPriceDisplay">USD 0.00</dd>
        </div>
        <div>
          <dt>Quantity</dt>
          <dd id="quantityDisplay">0</dd>
        </div>
        <div class="highlight-row total-row">
          <dt>Total FOB amount</dt>
          <dd id="totalAmountDisplay">USD 0.00</dd>
        </div>
      </dl>

      <label class="quote-language-label">
        Quote language / 报价语言
        <select id="quoteLanguage" name="quoteLanguage">
          <option value="english">English</option>
          <option value="spanish">Español</option>
          <option value="portuguese">Português</option>
        </select>
      </label>

      <h2>WhatsApp Quote</h2>
      <textarea id="quoteText" class="quote-text" rows="13" readonly></textarea>
      <button type="button" id="copyQuoteButton" class="primary-button">Copy quotation text</button>
      <p id="copyStatus" class="copy-status" aria-live="polite"></p>
    </section>
  </main>

  <script src="src/defaultData.js"></script>
  <script src="src/calculator.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
